name: iOS Simulator Launch Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch-smoke:
    name: Build, install, and launch on iOS Simulator
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Select an available iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          UDID="$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for _,xs in d["devices"].items() for x in xs if x.get("isAvailable") and x.get("name", "").startswith("iPhone")))')"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$UDID"

      - name: Boot simulator
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          xcrun simctl boot "$SIMULATOR_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      - name: Build app for simulator
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/VesperSimulatorDerivedData" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_IDENTITY=- \
            | tee "$RUNNER_TEMP/simulator-build.log"

      - name: Install and launch app
        id: launch
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
          APP_PATH: ${{ runner.temp }}/VesperSimulatorDerivedData/Build/Products/Release-iphonesimulator/SAKK EXTERNAL.app
          BUNDLE_ID: com.apple.mobile.MobileHouseArrest
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/vesper-launch-diagnostics"
          DIAG="$RUNNER_TEMP/vesper-launch-diagnostics"
          echo "Bundle ID in source: $BUNDLE_ID" | tee "$DIAG/summary.txt"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist" | tee -a "$DIAG/summary.txt"
          xcrun simctl install "$SIMULATOR_UDID" "$APP_PATH" >"$DIAG/install.txt" 2>&1
          INSTALL_STATUS=$?
          cat "$DIAG/install.txt"
          if [ "$INSTALL_STATUS" -ne 0 ]; then
            echo "Simulator installation failed with exit $INSTALL_STATUS" | tee -a "$DIAG/summary.txt"
            exit "$INSTALL_STATUS"
          fi
          xcrun simctl launch "$SIMULATOR_UDID" "$BUNDLE_ID" >"$DIAG/launch.txt" 2>&1
          LAUNCH_STATUS=$?
          cat "$DIAG/launch.txt"
          sleep 8
          xcrun simctl io "$SIMULATOR_UDID" screenshot "$DIAG/after-launch.png" >/dev/null 2>&1 || true
          xcrun simctl spawn "$SIMULATOR_UDID" launchctl list >"$DIAG/launchctl-list.txt" 2>&1 || true
          xcrun simctl spawn "$SIMULATOR_UDID" log show --last 2m --style compact --predicate 'process == "SAK" OR process == "SpringBoard" OR eventMessage CONTAINS[c] "MobileHouseArrest"' >"$DIAG/device-log.txt" 2>&1 || true
          if grep -Fq "$BUNDLE_ID" "$DIAG/launchctl-list.txt"; then
            echo "Launch stayed alive for 8 seconds." | tee -a "$DIAG/summary.txt"
            exit 0
          fi
          xcrun simctl spawn "$SIMULATOR_UDID" ps -A >"$DIAG/process-list.txt" 2>&1 || true
          if grep -Eiq '(^|[[:space:]])SAK([[:space:]]|$)' "$DIAG/process-list.txt"; then
            echo "Process SAK remains alive after 8 seconds." | tee -a "$DIAG/summary.txt"
            exit 0
          fi
          echo "App process did not remain alive after launch (simctl launch exit=$LAUNCH_STATUS)." | tee -a "$DIAG/summary.txt"
          cat "$DIAG/device-log.txt" | tail -n 120
          exit 1

      - name: Upload launch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vesper-ios-launch-diagnostics
          path: |
            ${{ runner.temp }}/simulator-build.log
            ${{ runner.temp }}/vesper-launch-diagnostics
          if-no-files-found: warn
          retention-days: 7
